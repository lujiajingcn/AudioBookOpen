# ===== 开发环境配置 =====

# 仅限本地开发的 JWT 密钥（故意提交进仓库，生产严禁使用——生产由 JWT_SECRET 环境变量注入，
# 缺失时 JwtUtil 直接启动失败）。换密钥后旧的本地 token 会失效，重新登录即可。
jwt:
  secret: ${JWT_SECRET:dev-only-jwt-secret-change-me}

# MySQL（本地开发，可用环境变量覆盖）
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/audiobook_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:audiobook}
    password: ${DB_PASSWORD:change-me-dev-db}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

app:
  # 上传目录
  upload:
    dir: uploads
  # 书城书籍目录（按分类建子目录）
  store:
    dir: store_books
  # 本地开发保留模拟支付，方便跑通「充值 -> 到账」链路；
  # 生产环境由 PAY_ALLOW_MOCK=false 关闭（参见 application-prod.yml）。
  payment:
    allow-mock: true

# 本地开发使用 MOSS-TTS-Nano。
# 注意：这里只是「tts_nodes 表为空时的种子地址」，首次启动会用它落一条默认节点记录。
# 之后想在本地测多节点，直接往 tts_nodes 表插几行（或走管理后台）即可，不必改这个文件。
moss:
  tts:
    url: http://localhost:18083/api/generate
